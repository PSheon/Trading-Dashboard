name: Setup workspace
description: pnpm, Node 22 with the pnpm store cache, a frozen install and (optionally) the Turborepo cache.
inputs:
  turbo-cache:
    description: Restore and save .turbo/cache under this key prefix (one per job). Empty skips it.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # pnpm first: setup-node's `cache: pnpm` asks pnpm for its store path.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        run_install: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22'
        cache: pnpm
    # Turborepo's local cache (build, typecheck and lint results keyed by
    # their inputs). Each run restores the newest entry for its job and saves
    # its own; TURBO_CACHE_MAX_SIZE in ci.yml keeps it from growing forever.
    - if: inputs.turbo-cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache }}-
    - name: Install from lockfile
      shell: bash
      run: pnpm install --frozen-lockfile
