name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # CI has no Privy app: its web builds are compile checks, and
      # `next typegen` (the typecheck) loads next.config.ts in the build
      # phase too. next.config.ts refuses such a build unless it says it is
      # anonymous on purpose; Railway's web build has the app id.
      NEXT_ALLOW_ANONYMOUS_BUILD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Dependency override compatibility
        run: node --test scripts/dependency-compatibility.test.mjs
      # No upstream fix yet. This exact advisory is mitigated by the versioned
      # braces patch, whose exploit/compatibility tests MUST pass first.
      # Remove the exception and patch together when a fixed release is adopted.
      - name: Dependency security audit
        run: pnpm audit --audit-level moderate
      - name: Build shared contracts
        run: pnpm --filter @trading-dashboard/shared build
      - name: Migration schema freshness
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain -- packages/shared/drizzle)"
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: HTTP contract documentation
        run: |
          pnpm --filter @trading-dashboard/api build
          node scripts/http-contract-docs.mjs --check
          node scripts/openapi.mjs --check
          node --test scripts/openapi.test.mjs
      - name: Test database URL guards
        run: node --test scripts/test-database.test.mjs
      - name: Safe release migration diagnostics
        run: node --test apps/api/scripts/migrate.test.mjs
      - name: API tests with disposable migrated database
        run: pnpm test:api:isolated
      - name: Concurrent release migration smoke
        run: node scripts/migration-smoke.mjs
      - name: PostgreSQL restore tooling
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Synthetic backup and restore
        run: node scripts/backup-restore-smoke.mjs
        env:
          PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
          PG_RESTORE: /usr/lib/postgresql/16/bin/pg_restore
      - name: Web tests
        run: pnpm --filter @trading-dashboard/web test
      - name: Compiled API bootstrap and shutdown
        run: pnpm test:bootstrap
      - name: Production builds
        run: pnpm build
      - name: API runtime image
        run: docker build -f apps/api/Dockerfile -t orbie-api:ci .
      - name: Frozen runtime dependencies, container migration and readiness
        run: node scripts/image-smoke.mjs orbie-api:ci
  # The browser suite needs no database (its server answers from fixtures),
  # so it runs beside verify instead of after the 20-minute api tests,
  # which pushed the single job past its timeout.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_ALLOW_ANONYMOUS_BUILD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm --filter @trading-dashboard/shared build
      - name: Install Chromium
        run: pnpm --filter @trading-dashboard/web exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm --filter @trading-dashboard/web test:e2e
