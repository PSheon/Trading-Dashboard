name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm --filter @trading-dashboard/shared build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: HTTP contract documentation
        run: node scripts/http-contract-docs.mjs --check
      - name: Test database URL guards
        run: node --test scripts/test-database.test.mjs
      - name: API tests with disposable migrated database
        run: pnpm test:api:isolated
      - name: Concurrent release migration smoke
        run: node scripts/migration-smoke.mjs
      - name: Web tests
        run: pnpm --filter @trading-dashboard/web test
      - name: Compiled API bootstrap and shutdown
        run: pnpm test:bootstrap
      - name: Install Chromium
        run: pnpm --filter @trading-dashboard/web exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm --filter @trading-dashboard/web test:e2e
      - name: Production builds
        run: pnpm build
      - name: API runtime image
        run: docker build -f apps/api/Dockerfile -t orbie-api:ci .
