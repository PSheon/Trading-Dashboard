packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 deploy derives a frozen production closure from this lockfile.
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

# The only audit exception has an installed patch and required exploit tests.
# `pnpm audit --ignore` writes configuration and exits; CI runs an actual audit.
auditConfig:
  ignoreCves:
    - CVE-2026-93687
  # zod < 4.6.6 (GHSA-mrhx-c7xc-m3w5, memory exhaustion on oversized constrained collections): every
  # installed zod is 3.25 and no 3.x patch exists; the 3→4 migration is scheduled after the 7-day
  # mainnet acceptance (docs/decisions-2026-10-23.md D16). Exposure is bounded: the api parses JSON
  # bodies under express's 100 kB default (apps/api/test/body-limit.spec.ts) and provider payloads
  # are capped by row before validation (SOURCE_PAGE_ROWS).
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# All installed ws consumers use the compatible 8.x line; minimum security fix.
overrides:
  'ws@>=8.0.0 <8.22.0': 8.22.0
  # 2026-10-24 advisories (denial of service / SRI bypass / scheme spoofing); minimum patched versions.
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'multer@>=2.0.0 <2.5.0': 2.5.0
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'undici@>=8.0.0 <8.12.2': 8.12.3
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  # Kit's legacy loader only uses transform APIs; covered by dependency smoke tests.
  '@esbuild-kit/core-utils@3.3.2>esbuild': 0.25.12
  # These exact MetaMask consumers use v4/validate; retain dual CJS/ESM exports.
  '@metamask/sdk@0.33.1>uuid': 11.1.1
  '@metamask/sdk-communication-layer@0.33.1>uuid': 11.1.1
  '@metamask/utils@8.5.0>uuid': 11.1.1
  '@metamask/utils@9.3.0>uuid': 11.1.1
  '@metamask/utils@11.12.1>uuid': 11.1.1
  # Published CJS/ESM/UMD bundles use URLSearchParams, not this stale dependency.
  '@walletconnect/utils@2.21.0>query-string': '-'
  '@walletconnect/utils@2.21.1>query-string': '-'
  # GHSA-68fv-2mgg-jv7q (event-loop DoS on indexed source-map offsets): patch release, same API.
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2

# Temporary fix for CVE-2026-93687; retain until an upstream fixed release exists.
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
