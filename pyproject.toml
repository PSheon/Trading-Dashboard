[project]
name = "smartwallet"
version = "0.1.0"
description = "Point-in-time Solana smart-wallet profiling"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "polars>=1.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
sw = "smartwallet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartwallet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
